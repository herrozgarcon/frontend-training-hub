<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flixnet</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">

            <div class="logo">
                    <img src="../task1_netflix_replica/images/logo.png" alt="Netflix Logo">
            </div>
        <div class="nav-links">
  
            <div class="items">
                <label for="search"></label>
                <select id="language-select">
                    <option value="en">English</option>
                    <option value="hi">Hindi</option>
                </select>
            </div>

            <div class="items">
                <button class="login-button"><a href="https://www.netflix.com/in/login">Login</a></button>
            </div>
        </div>
    </nav>


    <div class="content">
        <div class="tagline">
            <h1 >Unlimited movies, TV shows, and more.</h1>
            <h2>Watch anywhere. Cancel anytime.</h2>
            <p>Ready to watch? Enter your email to create or restart your membership.</p>
        </div>

        <div class="mail">
            <input type="email" placeholder="Email address">
            <button class="get-started-button"><a href="https://www.netflix.com">Get Started</a></button>
        </div>
    </div>
</body>
</html>
