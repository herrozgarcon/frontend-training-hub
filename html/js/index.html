<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">
        
        <div class="container">
            <h1>BMI calculator</h1>
        <form onsubmit="event.preventDefault(); printname();">
            <table>
                <tr>
                    <td><label for="inp">enter your name </label></td>
                    <td><input type="text" id ="inp" ></td>
                </tr>
                <tr>
                    <td><label for="age">enter your age</label></td>
                    <td><input type="number" id="age"></td>
                </tr>
                <tr>
                    <td><label for="gender">select your gender</label></td>
                    <td>
                        <input type="radio" name="gender" value="male">
                        <label for="male">male</label>
                        <input type="radio" name="gender" value="female">
                        <label for="female">female</label>
                    </td>
                </tr>
                <tr>
                    <td><label for="height">enter your height (cm)</label></td>
                    <td><input type="number" id="height" step="any"></td>
                </tr>
                <tr>
                    <td><label for="weight">enter your weight</label></td>
                    <td><input type="number" id="weight"></td>
                </tr>
            </table>
            
            <div class="btn">
            <button type="button" onclick="printname()">submit</button>
            </div>
        </form>
        
    </div>
    <p id="para"></p>
    </div>
    <script src="script.js"></script>

</body>
</html>
